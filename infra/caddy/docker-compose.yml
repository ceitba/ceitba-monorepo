services:
  caddy:
    image: caddy:2-alpine
    container_name: ceitba-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # This directory (Caddyfile sits next to this file, here and in ~/infra
      # on the VPS), not the single file: the deploy replaces Caddyfile with a
      # new inode, which a file bind mount would never show, and then runs
      # `caddy reload` (no restart, no dropped connections).
      - .:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
      - /var/www:/var/www:ro
    networks:
      - ceitba-proxy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:

networks:
  ceitba-proxy:
    name: ceitba-proxy
    driver: bridge
