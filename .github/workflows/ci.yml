name: CI

# Checks for PRs, the merge queue (merge_group) and pushes to dev. Only the apps
# a change touches run:
#   - api (apps/api-ts, Bun): typecheck, unit + in-process tests, the contract
#     suite and an image build, on PRs (into dev or main) and in the merge queue
#     (the merged result, before it reaches main). Testcontainers starts
#     Postgres (pgvector) and MinIO through the runner's Docker.
#   - web (the site, scheduler and newsletter, one app): lint + production
#     build (its only gate; there is no JS test runner).
#   - mcp (apps/mcp + packages/scheduler-core): typecheck + bun test + image build.
#   - ci-ok: the one required check of the main ruleset (merge queue). It passes
#     when every job above passed or was skipped, so path-filtered jobs never
#     block a merge by not reporting.
# Runs with no secrets: fork PRs must never reach deploy credentials.
on:
  pull_request:
    branches: [dev, main]
  merge_group:
  push:
    branches: [dev]

permissions:
  contents: read

# One run at a time per branch; superseded PR runs are cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      mcp: ${{ steps.filter.outputs.mcp }}
      spas: ${{ steps.spas.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The merge queue compares against the group's base commit, so it needs history.
          fetch-depth: ${{ github.event_name == 'merge_group' && '0' || '1' }}
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          # merge_group has no PR payload: diff the queued commit against its base.
          base: ${{ github.event.merge_group.base_sha }}
          filters: |
            # The API is a workspace package: the root manifest and bun.lock are
            # its dependencies too. It imports nothing from packages/.
            api:
              - 'apps/api/**'
              - 'apps/api-ts/**'
              - 'infra/**'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/ci.yml'
            shared: &shared
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - '.github/spa-apps.json'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/web/**'
              - *shared
            mcp:
              - 'apps/mcp/**'
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/ci.yml'
      - id: spas
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}
        run: echo "matrix=$(jq -c --argjson changes "$CHANGES" '[.[] | select(.app as $a | $changes | index($a))]' .github/spa-apps.json)" >> "$GITHUB_OUTPUT"

  api-test:
    needs: changes
    if: >-
      needs.changes.outputs.api == 'true'
      && (github.event_name == 'merge_group' || github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json # packageManager: the bun that writes bun.lock
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run --cwd apps/api-ts build
      - name: Unit + in-process tests
        run: bun run --cwd apps/api-ts test
      - name: Contract suite (black-box, against the Bun server)
        run: bun apps/api-ts/contract/run.ts --target ts
      - name: Image builds
        run: docker build -f apps/api-ts/Dockerfile -t ceitba-api:ci .
      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-contract-logs
          path: apps/api-ts/contract/.logs/
          include-hidden-files: true
          if-no-files-found: ignore

  spa-build:
    needs: changes
    if: needs.changes.outputs.spas != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.spas) }}
    name: build (${{ matrix.app }})
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json # packageManager: the bun that writes bun.lock
      - run: bun install --frozen-lockfile
      - run: bun run --filter '${{ matrix.package }}' lint
      - name: Production env
        env:
          APP_ENV: ${{ toJSON(matrix.env) }}
        run: jq -r 'to_entries[] | "\(.key)=\(.value)"' <<< "$APP_ENV" >> "$GITHUB_ENV"
      - run: bun run --filter '${{ matrix.package }}' build


  mcp-test:
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json # packageManager: the bun that writes bun.lock
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run --filter '@ceitba/scheduler-core' --filter '@ceitba/mcp' lint
      - name: Test
        run: bun run --filter '@ceitba/scheduler-core' --filter '@ceitba/mcp' test
      - name: Image builds
        run: docker build -f apps/mcp/Dockerfile -t ceitba-mcp:ci .

  ci-ok:
    needs: [changes, api-test, spa-build, mcp-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
