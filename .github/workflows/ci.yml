name: CI

# Checks for PRs (and pushes to dev). Only the apps a change touches run:
#   - api: Maven unit + integration tests, on PRs into dev only. The dev -> main
#     release is tested again by the push to main it produces (deploy.yml).
#   - web (the site, scheduler and newsletter, one app): lint + production
#     build (its only gate; there is no JS test runner).
# Runs with no secrets: fork PRs must never reach deploy credentials.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: read

# One run at a time per branch; superseded PR runs are cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      spas: ${{ steps.spas.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'infra/**'
              - '.github/workflows/ci.yml'
            shared: &shared
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - '.github/spa-apps.json'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/web/**'
              - *shared
      - id: spas
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}
        run: echo "matrix=$(jq -c --argjson changes "$CHANGES" '[.[] | select(.app as $a | $changes | index($a))]' .github/spa-apps.json)" >> "$GITHUB_OUTPUT"

  api-test:
    needs: changes
    if: needs.changes.outputs.api == 'true' && github.event_name == 'pull_request' && github.base_ref == 'dev'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: apps/api/pom.xml
      - name: Build + run unit and integration tests
        # Failsafe spins up Testcontainers Postgres via the host Docker socket.
        run: ./mvnw -B -ntp verify
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports
          path: |
            apps/api/target/surefire-reports/
            apps/api/target/failsafe-reports/

  spa-build:
    needs: changes
    if: needs.changes.outputs.spas != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.spas) }}
    name: build (${{ matrix.app }})
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2 # the version that wrote bun.lock; bump both together
      - run: bun install --frozen-lockfile
      - run: bun run --filter '${{ matrix.package }}' lint
      - name: Production env
        env:
          APP_ENV: ${{ toJSON(matrix.env) }}
        run: jq -r 'to_entries[] | "\(.key)=\(.value)"' <<< "$APP_ENV" >> "$GITHUB_ENV"
      - run: bun run --filter '${{ matrix.package }}' build
