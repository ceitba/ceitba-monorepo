name: CI

# Checks for PRs, the merge queue (merge_group) and pushes to dev. Only the apps
# a change touches run:
#   - api (apps/api, Bun): typecheck, unit + in-process tests, the contract
#     suite, route coverage and an image build, on PRs (into dev or main) and in the merge queue
#     (the merged result, before it reaches main). Testcontainers starts
#     Postgres (pgvector) and MinIO through the runner's Docker.
#   - web (the site, scheduler and newsletter, one app): lint + production
#     build (its only gate; there is no JS test runner).
#   - api-contract-java: the same contract suite against the jar of the last
#     Java commit (the reference implementation), plus the jar-gated tests.
#   - mcp (apps/mcp + packages/scheduler-core): typecheck + bun test + image build.
#   - ci-ok: the one required check of the main ruleset (merge queue). It passes
#     when every job above passed or was skipped, so path-filtered jobs never
#     block a merge by not reporting.
# Runs with no secrets: fork PRs must never reach deploy credentials.
on:
  pull_request:
    branches: [dev, main]
  merge_group:
  push:
    branches: [dev]

permissions:
  contents: read

# One run at a time per branch; superseded PR runs are cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      mcp: ${{ steps.filter.outputs.mcp }}
      spas: ${{ steps.spas.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The merge queue compares against the group's base commit, so it needs history.
          fetch-depth: ${{ github.event_name == 'merge_group' && '0' || '1' }}
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          # merge_group has no PR payload: diff the queued commit against its base.
          base: ${{ github.event.merge_group.base_sha }}
          filters: |
            # The API is a workspace package: the root manifest and bun.lock are
            # its dependencies too. It imports nothing from packages/.
            api:
              - 'apps/api/**'
              - 'infra/**'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/ci.yml'
            shared: &shared
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - '.github/spa-apps.json'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/web/**'
              - *shared
            mcp:
              - 'apps/mcp/**'
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/ci.yml'
      - id: spas
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}
        run: echo "matrix=$(jq -c --argjson changes "$CHANGES" '[.[] | select(.app as $a | $changes | index($a))]' .github/spa-apps.json)" >> "$GITHUB_OUTPUT"

  api-test:
    needs: changes
    if: >-
      needs.changes.outputs.api == 'true'
      && (github.event_name == 'merge_group' || github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json # packageManager: the bun that writes bun.lock
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run --cwd apps/api build
      - name: Unit + in-process tests
        run: bun run --cwd apps/api test
      - name: Contract suite (black-box, against the Bun server)
        run: bun apps/api/contract/run.ts --target ts
      - name: Route coverage (every OpenAPI operation has a handler and a contract hit from the run above)
        run: bun apps/api/contract/coverage.ts --check --target ts
      - name: Image builds
        run: docker build -f apps/api/Dockerfile -t ceitba-api:ci .
      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-contract-logs
          path: apps/api/contract/.logs/
          include-hidden-files: true
          if-no-files-found: ignore

  # The contract suite against the reference implementation: the jar of the last
  # Java commit. A test that the Spring app fails is a test of something the
  # Bun API changed; the deliberate hardenings skip themselves on java. Also runs
  # the jar-gated tests: cross-runtime and cross-signing (both runtimes on one
  # database) and the Flyway parity check (test/db/migrate.test.ts).
  api-contract-java:
    needs: changes
    if: >-
      needs.changes.outputs.api == 'true'
      && (github.event_name == 'merge_group' || github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: b515215118d7508fcc538d9bc12486c0254dfaea # origin/main before the Bun cutover
          path: java-ref
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: java-ref/apps/api/pom.xml
      - name: Build the reference jar
        working-directory: java-ref/apps/api
        run: ./mvnw -B -ntp -q package -DskipTests
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json # packageManager: the bun that writes bun.lock
      - run: bun install --frozen-lockfile
      - name: Contract suite against the Java jar (+ cross-runtime, cross-signing)
        run: |
          export CONTRACT_JAR="$GITHUB_WORKSPACE/java-ref/apps/api/target/ceitba-api-1.0.0.jar"
          export CONTRACT_JAVA_HOME="$JAVA_HOME"
          bun apps/api/contract/run.ts --target java
      - name: Flyway parity against the jar's own migrations
        working-directory: apps/api
        run: |
          export CONTRACT_JAR="$GITHUB_WORKSPACE/java-ref/apps/api/target/ceitba-api-1.0.0.jar"
          export CONTRACT_JAVA_HOME="$JAVA_HOME"
          bun test ./test/db/migrate.test.ts
      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-contract-java-logs
          path: apps/api/contract/.logs/
          include-hidden-files: true
          if-no-files-found: ignore

  spa-build:
    needs: changes
    if: needs.changes.outputs.spas != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.spas) }}
    name: build (${{ matrix.app }})
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json # packageManager: the bun that writes bun.lock
      - run: bun install --frozen-lockfile
      - run: bun run --filter '${{ matrix.package }}' lint
      - name: Production env
        env:
          APP_ENV: ${{ toJSON(matrix.env) }}
        run: jq -r 'to_entries[] | "\(.key)=\(.value)"' <<< "$APP_ENV" >> "$GITHUB_ENV"
      - run: bun run --filter '${{ matrix.package }}' build


  mcp-test:
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json # packageManager: the bun that writes bun.lock
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run --filter '@ceitba/scheduler-core' --filter '@ceitba/mcp' lint
      - name: Test
        run: bun run --filter '@ceitba/scheduler-core' --filter '@ceitba/mcp' test
      - name: Image builds
        run: docker build -f apps/mcp/Dockerfile -t ceitba-mcp:ci .

  ci-ok:
    needs: [changes, api-test, api-contract-java, spa-build, mcp-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
