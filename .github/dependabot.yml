# Dependency updates. Version updates open against main (the repo has no dev
# branch on the remote; Dependabot skips a target-branch that does not exist);
# security updates go to the default branch (main) too. Minor/patch updates are
# grouped per ecosystem;
# majors come one PR each. Commit messages are Conventional Commits:
# "chore(deps): ..." / "chore(deps-dev): ..." (docs/adr/0003).
# Not covered: the bun version itself (packageManager in package.json, read by
# CI, and the oven/bun base image of apps/api/Dockerfile, which must match it:
# bump both together) and the SheetJS tarball in apps/web (not on the npm registry).
version: 2

updates:
  - package-ecosystem: bun
    directory: /
    target-branch: main
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 3 }
    open-pull-requests-limit: 10
    commit-message: { prefix: chore, include: scope }
    ignore:
      - dependency-name: xlsx
    groups:
      # One bun.lock for the whole workspace: apps/web, apps/mcp, apps/api and packages/*.
      bun-workspace-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 3 }
    commit-message: { prefix: ci }
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: docker-compose
    directories: [/apps/api, /infra/caddy]
    target-branch: main
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: chore, include: scope }
    ignore:
      # Postgres/Caddy majors need a data or config migration: do them by hand.
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /apps/api/scripts/firestore-export
    target-branch: main
    schedule: { interval: monthly }
    commit-message: { prefix: chore, include: scope }
    groups:
      firestore-export:
        patterns: ["*"]
