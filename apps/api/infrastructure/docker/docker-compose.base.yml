services:
  postgres:
    image: postgres:16-alpine
    container_name: ceitba-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ceitba_db}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ceitba_password}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ceitba-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-ceitba_db}"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local

networks:
  ceitba-network:
    driver: bridge
