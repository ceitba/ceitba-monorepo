services:
  postgres:
    image: postgres:16-alpine
    container_name: ceitba-postgres
    environment:
      POSTGRES_DB: ceitba_db
      POSTGRES_USER: ceitba_user
      POSTGRES_PASSWORD: ceitba_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ceitba-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ceitba_user -d ceitba_db"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local

networks:
  ceitba-network:
    driver: bridge
