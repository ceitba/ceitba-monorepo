services:
  caddy:
    image: caddy:2-alpine
    container_name: ceitba-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - ceitba-proxy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:

networks:
  ceitba-proxy:
    name: ceitba-proxy
    driver: bridge
