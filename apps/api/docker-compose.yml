services:
  postgres:
    extends:
      file: infrastructure/docker/docker-compose.base.yml
      service: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ceitba_db}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ceitba_password}

  ceitba-api-dev:
    extends:
      file: infrastructure/docker/docker-compose.dev.yml
      service: ceitba-api-dev

volumes:
  postgres_data:
    driver: local

networks:
  ceitba-network:
    driver: bridge
