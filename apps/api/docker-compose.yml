services:
  postgres:
    image: postgres:16-alpine
    container_name: ceitba-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ceitba_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ceitba_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ceitba-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ceitba_db}"]
      interval: 30s
      timeout: 10s
      retries: 3

  ceitba-api:
    image: ghcr.io/ceitba/ceitba-api:latest
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    container_name: ceitba-api
    # Loopback only: Caddy reaches the API over the ceitba-proxy network. A
    # public port would let clients skip Caddy and forge X-Forwarded-For.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ceitba_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ceitba_password}
      ITBA_API_BASE_URL: ${ITBA_API_BASE_URL:-}
      ITBA_API_TOKEN: ${ITBA_API_TOKEN:-}
      ITBA_API_TIMEOUT: ${ITBA_API_TIMEOUT:-30000}
      AUTH_ALLOWED_DOMAINS: ${AUTH_ALLOWED_DOMAINS:-itba.edu.ar}
      AUTH_ALLOWED_EMAILS: ${AUTH_ALLOWED_EMAILS:-}
      AUTH_SYNC_API_KEY: ${AUTH_SYNC_API_KEY:-}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      CONTENT_HMAC_SECRET: ${CONTENT_HMAC_SECRET:-}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-https://ceitba.org.ar/api}
      AUTH_JWT_ENFORCE_ISS_AUD: ${AUTH_JWT_ENFORCE_ISS_AUD:-false}
      AUTH_MOBILE_ACCESS_TTL: ${AUTH_MOBILE_ACCESS_TTL:-15m}
      AUTH_REFRESH_TTL: ${AUTH_REFRESH_TTL:-60d}
      AUTH_REFRESH_REUSE_GRACE: ${AUTH_REFRESH_REUSE_GRACE:-60s}
      AUTH_GOOGLE_MOBILE_AUDIENCES: ${AUTH_GOOGLE_MOBILE_AUDIENCES:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      SYNC_ENABLED: ${SYNC_ENABLED:-true}
      MOBILE_MIN_VERSION: ${MOBILE_MIN_VERSION:-0.0.0}
      MOBILE_LATEST_VERSION: ${MOBILE_LATEST_VERSION:-0.0.0}
      MOBILE_MAINTENANCE: ${MOBILE_MAINTENANCE:-false}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH:-}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_TRUST_FORWARDED_FOR: ${RATE_LIMIT_TRUST_FORWARDED_FOR:-true}
      RATE_LIMIT_AUTH_CAPACITY: ${RATE_LIMIT_AUTH_CAPACITY:-20}
      RATE_LIMIT_AUTH_PERIOD: ${RATE_LIMIT_AUTH_PERIOD:-1m}
      RATE_LIMIT_MOBILE_LOGIN_CAPACITY: ${RATE_LIMIT_MOBILE_LOGIN_CAPACITY:-120}
      RATE_LIMIT_MOBILE_LOGIN_PERIOD: ${RATE_LIMIT_MOBILE_LOGIN_PERIOD:-1m}
      RATE_LIMIT_REFRESH_CAPACITY: ${RATE_LIMIT_REFRESH_CAPACITY:-120}
      RATE_LIMIT_REFRESH_PERIOD: ${RATE_LIMIT_REFRESH_PERIOD:-1m}
      RATE_LIMIT_PROPOSAL_ATTACHMENTS_CAPACITY: ${RATE_LIMIT_PROPOSAL_ATTACHMENTS_CAPACITY:-30}
      RATE_LIMIT_PROPOSAL_ATTACHMENTS_PERIOD: ${RATE_LIMIT_PROPOSAL_ATTACHMENTS_PERIOD:-1h}
      RATE_LIMIT_PROPOSALS_CAPACITY: ${RATE_LIMIT_PROPOSALS_CAPACITY:-10}
      RATE_LIMIT_PROPOSALS_PERIOD: ${RATE_LIMIT_PROPOSALS_PERIOD:-1h}
      RATE_LIMIT_PROPOSAL_COMMENTS_CAPACITY: ${RATE_LIMIT_PROPOSAL_COMMENTS_CAPACITY:-30}
      RATE_LIMIT_PROPOSAL_COMMENTS_PERIOD: ${RATE_LIMIT_PROPOSAL_COMMENTS_PERIOD:-10m}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_REGION: ${R2_REGION:-auto}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      R2_PRESIGN_TTL: ${R2_PRESIGN_TTL:-10m}
    networks:
      - ceitba-network
      - ceitba-proxy
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:
    driver: local

networks:
  ceitba-network:
    driver: bridge
  ceitba-proxy:
    external: true
