services:
  postgres:
    image: postgres:16-alpine
    container_name: ceitba-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ceitba_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ceitba_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ceitba-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ceitba_db}"]
      interval: 30s
      timeout: 10s
      retries: 3

  ceitba-api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    container_name: ceitba-api
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ceitba_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ceitba_password}
      ITBA_API_BASE_URL: ${ITBA_API_BASE_URL:-}
      ITBA_API_TOKEN: ${ITBA_API_TOKEN:-}
      ITBA_API_TIMEOUT: ${ITBA_API_TIMEOUT:-30000}
      AUTH_ALLOWED_DOMAINS: ${AUTH_ALLOWED_DOMAINS:-itba.edu.ar}
      AUTH_ALLOWED_EMAILS: ${AUTH_ALLOWED_EMAILS:-}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-}
      AUTH_SYNC_API_KEY: ${AUTH_SYNC_API_KEY:-}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      SYNC_ENABLED: ${SYNC_ENABLED:-true}
    networks:
      - ceitba-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:
    driver: local

networks:
  ceitba-network:
    driver: bridge
