services:
  # Development environment
  ceitba-api-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: ceitba-api-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3000
    env_file:
      - .env
    networks:
      - ceitba-network
    restart: unless-stopped

  # Production environment
  ceitba-api-prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: ceitba-api-prod
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - .env
    networks:
      - ceitba-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

networks:
  ceitba-network:
    driver: bridge
