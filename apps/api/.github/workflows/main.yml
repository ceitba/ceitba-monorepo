name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy app
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          key: ${{ secrets.SSH_KEY }}
          username: ${{ secrets.SSH_USERNAME }}
          script: |
            cd CEITBA-API/
            git pull https://ceitba:${{ secrets.GITHUB_TOKEN }}@github.com/ceitba/CEITBA-API.git
            docker compose pull
            docker compose up -d --build
