name: Deploy

on:
  workflow_run:
    workflows: ["Build & Test"]
    branches: [main]
    types: [completed]

# Deploys run one at a time, in order, and are never cancelled mid-way.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Sync the compose files and the Caddyfile on every deploy so the VPS
      # never drifts from the repo. Only these explicit files are copied:
      # never .env (secrets live only on the VPS).
      # ~/infra layout (infrastructure/caddy/docker-compose.yml):
      #   ~/infra/docker-compose.yml, ~/infra/Caddyfile (bind-mounted read-only
      #   at /etc/caddy/Caddyfile in ceitba-caddy).
      - name: Copy infra config to VPS
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "infrastructure/caddy/docker-compose.yml,infrastructure/caddy/Caddyfile"
          target: "~/infra/"
          strip_components: 2

      - name: Copy API compose to VPS
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml"
          target: "~/CEITBA-API/"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN
          script: |
            set -e
            echo "$GHCR_TOKEN" | docker login ghcr.io -u ceitba --password-stdin

            # Fail before touching anything if ~/CEITBA-API/.env lacks a
            # required variable (e.g. MINIO_ROOT_*, STORAGE_* on first deploy).
            cd ~/CEITBA-API
            docker compose config -q

            # Bring up infra (Caddy) first — creates the ceitba-proxy network
            cd ~/infra
            docker compose up -d
            # The Caddyfile is a single-file bind mount. scp replaces the file
            # (new inode), which the running container does not see, so a
            # `caddy reload` would reload the old config. When it changed,
            # validate the new file in a throwaway container, then restart
            # Caddy (a second or two of downtime) to re-bind the mount.
            if ! docker exec ceitba-caddy cat /etc/caddy/Caddyfile | cmp -s - Caddyfile; then
              docker compose run --rm --no-deps -T caddy \
                caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
              docker compose restart caddy
            fi

            # Deploy API — joins ceitba-proxy so Caddy can reach it. minio-init
            # (re)creates the bucket and service user before the API starts.
            cd ~/CEITBA-API
            docker compose pull ceitba-api
            docker compose up -d
            docker image prune -f
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
