name: Deploy API
on:
  push:
    branches: [main, dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout API repo
        uses: actions/checkout@v3

      - name: Build and push image
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker build -f infrastructure/docker/Dockerfile -t ghcr.io/ceitba/ceitba-api:${{ github.sha }} .
          docker push ghcr.io/ceitba/ceitba-api:${{ github.sha }}

      - name: Deploy to server
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd CEITBA-API/
            git pull https://ceitba:${{ secrets.GITHUB_TOKEN}}@github.com/CEITBA-git/CEITBA-API.git

            # Login to GHCR on the server
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Use the pushed image instead of building
            export CEITBA_API_IMAGE=ghcr.io/ceitba/ceitba-api:${{ github.sha }}
            docker-compose -f infrastructure/docker/docker-compose.base.yml -f infrastructure/docker/docker-compose.prod.yml down
            docker-compose -f infrastructure/docker/docker-compose.base.yml -f infrastructure/docker/docker-compose.prod.yml up -d
