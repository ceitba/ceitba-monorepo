name: Build & Test

# Each change is tested once per branch it lands on:
#   - PRs into dev / migration/** run the suite (the review gate).
#   - Pushes to main run the suite again before the image is built and
#     Deploy runs: there is no branch protection, so a PR can be merged
#     before its checks finish and main must stay a real gate.
#   - Pushes to dev and PRs into main run nothing: dev is not deployed, and
#     the dev -> main release is tested by the push to main it produces.
on:
  push:
    branches: [main, "migration/**"]
  pull_request:
    branches: [dev, "migration/**"]

# One run at a time per branch. Pushes queue instead of racing, so an older
# run can never finish last and overwrite a newer deploy/image; superseded PR
# runs are cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build + run unit and integration tests
        # Failsafe spins up Testcontainers Postgres via the host Docker socket;
        # ubuntu-latest has Docker preinstalled. IT classes share one Postgres
        # server with a database each (see SharedPostgres).
        run: ./mvnw -B -ntp verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/

  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ceitba/ceitba-api
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
