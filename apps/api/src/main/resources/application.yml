spring:
  application:
    name: ceitba-api
  profiles:
    active: dev
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ceitba_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    hikari:
      # The wiki pipeline's sync workers and Drive sync share the pool with web
      # requests (default 10). A transaction left idle for 5 minutes is ended by
      # Postgres, so a stuck worker can never hold connections indefinitely.
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-init-sql: SET idle_in_transaction_session_timeout = '5min'
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        # Default Spring strategy lowercases even backtick-quoted names,
        # which breaks the wiki."Subject_Bookmarks" mixed-case table.
        # Standard strategy respects whatever the @Table/@Column says.
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        # No hibernate.jdbc.time_zone on purpose. With it set (we had UTC),
        # Hibernate binds/reads LocalTime via java.sql.Time + a Calendar in
        # that zone, converting from the JVM zone (prod: ART, UTC-3): TIME
        # columns (commission_time.hour_from/hour_to, news_events times)
        # were read 3h early and written 3h late. Every timestamp column is
        # TIMESTAMPTZ mapped to OffsetDateTime, which Hibernate binds as an
        # absolute instant and never used this setting. See LocalTemporalZoneIT.
        format_sql: false
    open-in-view: false
  lifecycle:
    # Upper bound for the graceful phase of shutdown (requests in flight).
    timeout-per-shutdown-phase: 60s
  task:
    execution:
      shutdown:
        # The digest worker runs on this executor: wait for the email being
        # sent instead of killing it mid-SMTP (DigestSender stops taking new ones).
        await-termination: true
        await-termination-period: 60s
    scheduling:
      # One thread per scheduled job (12 >= the @Scheduled methods): with Spring's default single thread a
      # long Drive sync run delayed the wiki pipeline's sweep and batch polling, and the embedding sweep
      # (KbEmbeddingJob) can take a while on its first run.
      pool:
        size: 12
      shutdown:
        await-termination: true
        await-termination-period: 30s
  # SMTP for service/mail (used only with MAIL_ENABLED=true).
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 20000
      mail.smtp.writetimeout: 20000
  flyway:
    enabled: true
    schemas: public,wiki
    default-schema: public
    locations: classpath:db/migration
    # Allow applying a lower-numbered migration (e.g. V4.1) after higher
    # versions are already in flyway_schema_history. Needed when a schema
    # change is inserted before a seed-only migration that's already live.
    out-of-order: true

server:
  port: ${PORT:8080}
  # A deploy (SIGTERM) lets in-flight requests finish. The digest worker
  # (task executor) also gets to finish the email in flight; see
  # spring.task.execution.shutdown below.
  shutdown: graceful
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    # Boot's mail health check would open an SMTP connection (and log in) on
    # every /actuator/health hit; a Gmail hiccup must not mark the API down.
    mail:
      enabled: false

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /docs.json

auth:
  allowed-domains: ${AUTH_ALLOWED_DOMAINS:itba.edu.ar}
  allowed-emails: ${AUTH_ALLOWED_EMAILS:}
  sync-api-key: ${AUTH_SYNC_API_KEY:}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/auth/callback}
    # Comma list of OAuth client IDs accepted as `aud` of Google ID tokens on
    # POST /v1/auth/google/mobile. Empty = mobile login disabled (501).
    mobile-audiences: ${AUTH_GOOGLE_MOBILE_AUDIENCES:}
  jwt:
    secret: ${AUTH_JWT_SECRET:}
    ttl-days: ${AUTH_JWT_TTL_DAYS:7}
    issuer: ${AUTH_JWT_ISSUER:https://ceitba.org.ar/api}
    # true: every JWT must carry our iss and aud. false is the B1 phase-in
    # (validated only when present) — every pre-B1 cookie expired 2026-10-04.
    enforce-issuer-audience: ${AUTH_JWT_ENFORCE_ISS_AUD:true}
    mobile-access-ttl: ${AUTH_MOBILE_ACCESS_TTL:15m}
    refresh-ttl: ${AUTH_REFRESH_TTL:60d}
    # A rotated refresh token presented again within this window, while its
    # successor is still unused, gets a new successor instead of revoking the
    # family (the client never received the rotation response). 0 disables.
    refresh-reuse-grace: ${AUTH_REFRESH_REUSE_GRACE:60s}
  cookie:
    name:      ${AUTH_COOKIE_NAME:ceitba_session}
    domain:    ${AUTH_COOKIE_DOMAIN:}
    secure:    ${AUTH_COOKIE_SECURE:true}
    same-site: ${AUTH_COOKIE_SAMESITE:Lax}
    path:      ${AUTH_COOKIE_PATH:/}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  # App Store / Play review account (POST /v1/auth/review-login). Both empty =
  # disabled (404). The hash is bcrypt; never put the plain password here.
  # Enable only while a store review is pending. See docs/AUTH-AND-ROLES.md.
  review-login:
    email: ${REVIEW_LOGIN_EMAIL:}
    password-hash: ${REVIEW_LOGIN_PASSWORD_HASH:}
  # POST /v1/auth/dev-login (sign in as any email, optionally STAFF). Only
  # exists when this is true AND the `dev` profile is active. Never in prod.
  dev-login:
    enabled: ${AUTH_DEV_LOGIN_ENABLED:false}

# Root secret for keyed content hashes (service/crypto/ContentHmac): proposal
# attachment keys and imported Firestore comment ids. Empty = derive from
# AUTH_JWT_SECRET. Set it (32+ bytes, openssl rand -base64 32) so the JWT
# secret can be rotated without changing those hashes.
content:
  hmac-secret: ${CONTENT_HMAC_SECRET:}

itba:
  api:
    base-url: ${ITBA_API_BASE_URL:}
    token: ${ITBA_API_TOKEN:}
    timeout-millis: ${ITBA_API_TIMEOUT:30000}
    use-fake: ${ITBA_API_USE_FAKE:false}
    # Local dev only, with use-fake: plans nobody stubbed come from the local
    # plan_subject table (load it with scripts/dev-seed.sql).
    fake-from-db: ${ITBA_API_FAKE_FROM_DB:false}

sync:
  enabled: ${SYNC_ENABLED:false}

# Mobile app release control, served publicly by GET /v1/app/config.
mobile-app:
  min-version: ${MOBILE_MIN_VERSION:0.0.0}
  latest-version: ${MOBILE_LATEST_VERSION:0.0.0}
  maintenance: ${MOBILE_MAINTENANCE:false}

# Server-side push notifications through FCM (service/push). Service-account
# key JSON (raw or base64) or a path to it; both empty = pushes disabled.
push:
  fcm:
    service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}
    service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}

# S3-compatible object storage (self-hosted MinIO in prod, see
# docs/OBJECT-STORAGE.md) for presigned uploads (StorageProperties). Leave any
# of endpoint/bucket/keys/public URL empty to disable uploads (sign endpoints
# answer 501). STORAGE_* wins; the older R2_* names still work as fallbacks
# when the STORAGE_* variable is absent (not merely empty).
storage:
  endpoint: ${STORAGE_ENDPOINT:${R2_ENDPOINT:}}
  region: ${STORAGE_REGION:${R2_REGION:us-east-1}}
  bucket: ${STORAGE_BUCKET:${R2_BUCKET:}}
  access-key-id: ${STORAGE_ACCESS_KEY_ID:${R2_ACCESS_KEY_ID:}}
  secret-access-key: ${STORAGE_SECRET_ACCESS_KEY:${R2_SECRET_ACCESS_KEY:}}
  public-base-url: ${STORAGE_PUBLIC_URL:${R2_PUBLIC_URL:}}
  presign-ttl: ${STORAGE_PRESIGN_TTL:${R2_PRESIGN_TTL:10m}}
  # Server-side reads/writes (Drive sync) bypass Caddy: http://minio:9000 in
  # the compose network. Empty = use endpoint.
  internal-endpoint: ${STORAGE_INTERNAL_ENDPOINT:}

# Subject wikis (docs/SUBJECT-WIKI.md): a page is "stale" when its newest
# source is older than this many years.
kb:
  stale-years: ${KB_STALE_YEARS:3}
  # Inference (DigitalOcean: batch for anthropic-*/openai-* models, sync chat
  # completions otherwise) for the wiki pipeline (docs/SUBJECT-WIKI-PIPELINE.md,
  # docs/SUBJECT-WIKI-ADMIN.md). Empty key = dry runs only.
  llm:
    base-url: ${KB_LLM_BASE_URL:https://inference.do-ai.run}
    api-key: ${KB_LLM_API_KEY:}
    use-fake: ${KB_LLM_USE_FAKE:false}
    execution-mode: ${KB_EXECUTION_MODE:auto}
    sync-concurrency: ${KB_SYNC_CONCURRENCY:16}
    request-timeout: ${KB_LLM_REQUEST_TIMEOUT:PT5M}
  # Embeddings of the wiki pages for semantic search / RAG (docs/SUBJECT-WIKI.md
  # "Embeddings"): self-hosted EmbeddingGemma 2 on llama.cpp (ceitba-embeddings in
  # docker-compose.yml), or any OpenAI-compatible /v1. Empty base URL = off. The
  # model must return 768-long vectors (kb_page_chunk.embedding); changing it
  # re-embeds every page. Empty templates = EmbeddingGemma's retrieval prompts.
  embeddings:
    enabled: ${KB_EMBEDDINGS_ENABLED:true}
    base-url: ${KB_EMBEDDING_BASE_URL:}
    api-key: ${KB_EMBEDDING_API_KEY:}
    model: ${KB_EMBEDDING_MODEL:embeddinggemma-2}
    query-template: ${KB_EMBEDDING_QUERY_TEMPLATE:}
    document-template: ${KB_EMBEDDING_DOCUMENT_TEMPLATE:}
    use-fake: ${KB_EMBEDDING_USE_FAKE:${KB_LLM_USE_FAKE:false}}
    interval: ${KB_EMBEDDING_INTERVAL:PT5M}
    batch-size: ${KB_EMBEDDING_BATCH_SIZE:16}
    request-timeout: ${KB_EMBEDDING_REQUEST_TIMEOUT:PT2M}
  # OPTIONAL override of the AES-GCM key for custom LLM endpoint tokens stored in the DB
  # (base64 of 32 bytes, openssl rand -base64 32). Empty = derived from AUTH_JWT_SECRET (HKDF).
  secrets:
    key: ${KB_SECRETS_KEY:}
  pipeline:
    enabled: ${KB_PIPELINE_ENABLED:false}
    cron: ${KB_PIPELINE_CRON:0 0 3 * * SUN}
    # Safety sweep (resumes anything stuck, e.g. after a restart); runs are
    # otherwise advanced as soon as they are triggered.
    poll-interval: ${KB_POLL_INTERVAL:PT10M}
    # DO batch status polling (only while a batch is open).
    batch-poll-interval: ${KB_BATCH_POLL_INTERVAL:PT1M}
    model-digest: ${KB_MODEL_DIGEST:glm-5.3-flash}
    model-plan: ${KB_MODEL_PLAN:glm-5.3}
    model-write: ${KB_MODEL_WRITE:glm-5.3}
    model-retry: ${KB_MODEL_RETRY:}
    run-token-budget: ${KB_RUN_TOKEN_BUDGET:3000000}
    run-cost-budget-usd: ${KB_RUN_COST_BUDGET_USD:5.00}
    run-token-budget-max: ${KB_RUN_TOKEN_BUDGET_MAX:50000000}
    max-requests-per-stage: ${KB_RUN_MAX_REQUESTS_PER_STAGE:5000}
    batch-max-requests: ${KB_BATCH_MAX_REQUESTS:5000}
    digest-max-missing-ratio: ${KB_DIGEST_MAX_MISSING_RATIO:0.2}
    retry-rejected: ${KB_RETRY_REJECTED:true}
    background: ${KB_PIPELINE_BACKGROUND:true}

# Drive sync / Apuntes (docs/DRIVE-SYNC.md). Students share a Drive folder
# with the bot service account; the job copies it into storage (drive/ prefix,
# never anonymously readable) and serves it per subject.
drive-sync:
  enabled: ${DRIVE_SYNC_ENABLED:false}
  interval: ${DRIVE_SYNC_INTERVAL:PT30M}
  run-budget: ${DRIVE_SYNC_RUN_BUDGET:PT10M}
  # Base64 of the service-account key JSON. Empty (and use-fake false) = the
  # /v1/me/drive endpoints answer 503 DRIVE_SYNC_UNCONFIGURED.
  service-account-json: ${DRIVE_SYNC_SERVICE_ACCOUNT_JSON:}
  use-fake: ${DRIVE_SYNC_USE_FAKE:false}
  max-file-bytes: ${DRIVE_SYNC_MAX_FILE_BYTES:52428800}
  # Fake only: comma list of emails that each get a demo folder
  # "demo-<local part>" owned by them (register it with that id as the URL).
  fake-demo-owners: ${DRIVE_SYNC_FAKE_DEMO_OWNERS:}
  # Max time one source gets per run (at most half of it walking, the rest
  # fetching content), so a huge folder cannot starve the others.
  source-budget: ${DRIVE_SYNC_SOURCE_BUDGET:PT3M}
  # Files above this are handled by reference (text only, downloads stream
  # from Drive) even in COPY sources.
  reference-above-bytes: ${DRIVE_SYNC_REFERENCE_ABOVE_BYTES:20971520}
  # Walk caps per source and generation: hitting one ends the generation
  # with a warning (nothing is removed).
  max-items-per-source: ${DRIVE_SYNC_MAX_ITEMS_PER_SOURCE:20000}
  max-depth: ${DRIVE_SYNC_MAX_DEPTH:30}
  # Community archives: one source per top-level "<code> - <name>" folder.
  community-enabled: ${DRIVE_SYNC_COMMUNITY_ENABLED:true}
  # Dev only: comma list of subject codes; expansion is limited to them.
  community-only-codes: ${DRIVE_SYNC_COMMUNITY_ONLY_CODES:}

# Outgoing email (service/mail). MAIL_ENABLED=false (default) cannot send at
# all (digest send answers 409 MAIL_DISABLED), so dev and tests never email. Prod: the ceitba@itba.edu.ar Workspace account
# over Gmail SMTP with an app password (docs/WEEKLY-DIGEST.md).
mail:
  enabled: ${MAIL_ENABLED:false}
  # gmail-api (default; OAuth-connected sender account) | smtp | log.
  # "log" is only allowed with log-sends=true; enabled=false wins over it.
  transport: ${MAIL_TRANSPORT:gmail-api}
  oauth:
    # Registered on the Google OAuth client (same one as the login).
    redirect-uri: ${GOOGLE_MAIL_REDIRECT_URI:http://localhost:8080/api/v1/mail/accounts/oauth/callback}
    # 32 bytes, base64 (openssl rand -base64 32): encrypts the refresh tokens.
    token-encryption-key: ${MAIL_TOKEN_ENCRYPTION_KEY:}
  # DEV ONLY: with MAIL_ENABLED=false, log sends (masked addresses) and report
  # them as successful instead of refusing (409 MAIL_DISABLED). Never in prod.
  log-sends: ${MAIL_LOG_SENDS:false}
  from: ${MAIL_FROM:CEITBA <ceitba@itba.edu.ar>}
  # Sending quota (service/mail/MailSendService): recipients per rolling 24h
  # per sending account (the From address). Workspace caps ~2000/day.
  # DIGEST_DAILY_LIMIT is the older name, still honoured.
  daily-limit: ${MAIL_DAILY_LIMIT:${DIGEST_DAILY_LIMIT:1500}}
  # Per-account overrides (keys need brackets because of the dots/@):
  # daily-limits:
  #   "[otra@itba.edu.ar]": 500
  # Backoff after transport errors: doubled per consecutive error, capped.
  backoff-initial: ${MAIL_BACKOFF_INITIAL:PT5M}
  backoff-max: ${MAIL_BACKOFF_MAX:PT1H}
  # Pause after Gmail's own "5.4.5 daily sending limit exceeded".
  quota-pause: ${MAIL_QUOTA_PAUSE:PT24H}
  # Nightly cleanup (service/mail/MailRetentionService). The quota only reads
  # the last 24h of mail_send_log; the minimum accepted send-log value is 2 days.
  retention:
    send-log: ${MAIL_RETENTION_SEND_LOG:P30D}
    tracking-events: ${MAIL_RETENTION_TRACKING:P180D}

# Weekly digest "La semana en ITBA" (docs/WEEKLY-DIGEST.md).
# Organizations' emails to their followers (OrgMailProperties, docs/ORGANIZATIONS.md).
org-mail:
  allowed-domain: ${ORG_MAIL_ALLOWED_DOMAIN:itba.edu.ar}
  daily-limit: ${ORG_MAIL_DAILY_LIMIT:400}
  weekly-limit: ${ORG_MAIL_WEEKLY_LIMIT:3}
  jobs-enabled: ${ORG_MAIL_JOBS_ENABLED:true}

# Day-before push to the RSVPs of tomorrow's events (EventReminderJob).
events:
  reminders-enabled: ${EVENT_REMINDERS_ENABLED:true}

digest:
  # ItbaNews public URL (article links, the unsubscribe page).
  public-base-url: ${DIGEST_PUBLIC_BASE_URL:https://ceitba.org.ar/newsletter}
  # Public API base incl. /api (List-Unsubscribe one-click target).
  api-base-url: ${DIGEST_API_BASE_URL:https://ceitba.org.ar/api}
  # HARD guard: no digest email (test sends included) leaves for any other domain.
  allowed-domains: ${DIGEST_ALLOWED_DOMAINS:itba.edu.ar}
  # Open pixel + click redirects in sent issues (docs/WEEKLY-DIGEST.md).
  tracking-enabled: ${DIGEST_TRACKING_ENABLED:true}
  # Pause between two emails.
  send-interval: ${DIGEST_SEND_INTERVAL:PT1S}
  # Auto-send check / resume of stalled sends.
  tick-interval: ${DIGEST_TICK_INTERVAL:PT5M}
  jobs-enabled: ${DIGEST_JOBS_ENABLED:true}
  # "Tu cuatrimestre", the per-reader block.
  personal:
    # CeitbaPage's Apuntes reader: a subject's wiki is <url>/<subjectId>?vista=wiki.
    wiki-base-url: ${DIGEST_WIKI_BASE_URL:https://ceitba.org.ar/apuntes}
    # "Armá tu horario en la app": the web app's /app/* opens CEITBApp (or the
    # store on a phone without it, or the combinador on a desktop).
    scheduler-url: ${DIGEST_SCHEDULER_URL:https://ceitba.org.ar/app/horario}
    # Lifetime of the "¿Es así?" correction vote links.
    vote-token-ttl: ${DIGEST_VOTE_TOKEN_TTL:P14D}
    max-wiki-links: ${DIGEST_MAX_WIKI_LINKS:5}
    max-corrections: ${DIGEST_MAX_CORRECTIONS:3}

# Per-client-IP rate limiting (web/ratelimit/RateLimitFilter). In-memory, per
# instance. Paths are relative to the /api context path.
rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  # Behind Caddy: use the right-most X-Forwarded-For entry as the client IP.
  # Only honoured when the direct peer is a private/loopback address (i.e. the
  # proxy); requests reaching the API from a public address use that address.
  trust-forwarded-for: ${RATE_LIMIT_TRUST_FORWARDED_FOR:true}
  rules:
    auth:
      paths:
        - /v1/auth/**
      # Authenticated reads the SPA hits on every page load; limiting them per
      # IP would lock out everyone behind the campus NAT.
      exclude-paths:
        - /v1/auth/me
        - /v1/auth/api-keys
        - /v1/auth/api-keys/**
        - /v1/auth/refresh
        - /v1/auth/google/mobile
        - /v1/auth/review-login
      capacity: ${RATE_LIMIT_AUTH_CAPACITY:20}
      period: ${RATE_LIMIT_AUTH_PERIOD:1m}
    # First-time mobile logins: a whole class installing the app on campus
    # Wi-Fi logs in from one NAT address within a few minutes.
    auth-mobile-login:
      paths:
        - /v1/auth/google/mobile
      capacity: ${RATE_LIMIT_MOBILE_LOGIN_CAPACITY:120}
      period: ${RATE_LIMIT_MOBILE_LOGIN_PERIOD:1m}
    # Password login of the store review account: one account, tight bucket
    # to make online password guessing pointless.
    auth-review-login:
      paths:
        - /v1/auth/review-login
      capacity: ${RATE_LIMIT_REVIEW_LOGIN_CAPACITY:10}
      period: ${RATE_LIMIT_REVIEW_LOGIN_PERIOD:1m}
    # Mobile access tokens live 15 min, so every active app refreshes about
    # four times an hour; behind the campus NAT that is many devices per IP.
    # Its own, larger bucket keeps refresh from starving logins and vice versa.
    auth-refresh:
      paths:
        - /v1/auth/refresh
      capacity: ${RATE_LIMIT_REFRESH_CAPACITY:120}
      period: ${RATE_LIMIT_REFRESH_PERIOD:1m}
    # Anonymous newsletter writes. Votes are deduplicated per IP+User-Agent,
    # so a burst only means someone cycling User-Agents; GET counts stay
    # unlimited. Generous enough for a classroom behind the campus NAT.
    votes:
      paths:
        - /v1/articles/*/votes
      methods: [POST, DELETE]
      capacity: ${RATE_LIMIT_VOTES_CAPACITY:60}
      period: ${RATE_LIMIT_VOTES_PERIOD:1m}
    # Student schedule corrections (POST /v1/commissions/{id}/schedule-corrections).
    schedule-corrections:
      paths:
        - /v1/commissions/*/schedule-corrections
      methods: [POST]
      capacity: ${RATE_LIMIT_SCHEDULE_CORRECTIONS_CAPACITY:10}
      period: ${RATE_LIMIT_SCHEDULE_CORRECTIONS_PERIOD:1h}
    # Confirm/reject votes on corrections: same budget as the newsletter votes.
    schedule-correction-votes:
      paths:
        - /v1/schedule-corrections/*/vote
      methods: [PUT, DELETE]
      capacity: ${RATE_LIMIT_VOTES_CAPACITY:60}
      period: ${RATE_LIMIT_VOTES_PERIOD:1m}
    # Public one-click unsubscribe of the weekly digest. Gmail/Outlook POST
    # it from their own servers, so many users can share one address.
    digest-unsubscribe:
      paths:
        - /v1/digests/unsubscribe
      methods: [POST]
      capacity: ${RATE_LIMIT_DIGEST_UNSUBSCRIBE_CAPACITY:60}
      period: ${RATE_LIMIT_DIGEST_UNSUBSCRIBE_PERIOD:1m}
    # Public correction vote page of the digest ("¿Es así?"): the GET that
    # shows the correction and the POST that votes, both token-authenticated.
    digest-correction-vote:
      paths:
        - /v1/digests/correction-vote
      methods: [GET, POST]
      capacity: ${RATE_LIMIT_DIGEST_CORRECTION_VOTE_CAPACITY:60}
      period: ${RATE_LIMIT_DIGEST_CORRECTION_VOTE_PERIOD:1m}
    # Going to / cancelling an event RSVP: same budget as the newsletter votes.
    event-rsvp:
      paths:
        - /v1/news/events/*/rsvp
      methods: [POST, DELETE]
      capacity: ${RATE_LIMIT_VOTES_CAPACITY:60}
      period: ${RATE_LIMIT_VOTES_PERIOD:1m}
    # Public one-click unsubscribe of an organization's emails (like the digest's).
    org-mail-unsubscribe:
      paths:
        - /v1/org-mail/unsubscribe
      methods: [POST]
      capacity: ${RATE_LIMIT_DIGEST_UNSUBSCRIBE_CAPACITY:60}
      period: ${RATE_LIMIT_DIGEST_UNSUBSCRIBE_PERIOD:1m}
    # Digest open pixel / click redirects are NOT limited here: they must
    # always answer (GIF / redirect). MailTrackingService limits what it
    # records per client and per tracking id instead.
    # ItbaNews flushes one batch (<= 50 events) per tab every 10 s.
    analytics:
      paths:
        - /v1/analytics/events
      methods: [POST]
      capacity: ${RATE_LIMIT_ANALYTICS_CAPACITY:120}
      period: ${RATE_LIMIT_ANALYTICS_PERIOD:1m}
  # Per authenticated user (service/ratelimit/UserRateLimiter), not per IP.
  user-rules:
    # POST /v1/organizations/{slug}/media/sign-upload
    org-images:
      capacity: ${RATE_LIMIT_ORG_IMAGES_CAPACITY:60}
      period: ${RATE_LIMIT_ORG_IMAGES_PERIOD:1h}
    # GET /v1/wiki/kb/search (each query is an embedding call)
    wiki-search:
      capacity: ${RATE_LIMIT_WIKI_SEARCH_CAPACITY:120}
      period: ${RATE_LIMIT_WIKI_SEARCH_PERIOD:1h}
    # POST /v1/proposals/attachments/sign-upload
    proposal-attachments:
      capacity: ${RATE_LIMIT_PROPOSAL_ATTACHMENTS_CAPACITY:30}
      period: ${RATE_LIMIT_PROPOSAL_ATTACHMENTS_PERIOD:1h}
    # POST /v1/proposals
    proposals:
      capacity: ${RATE_LIMIT_PROPOSALS_CAPACITY:10}
      period: ${RATE_LIMIT_PROPOSALS_PERIOD:1h}
    # POST /v1/proposals/{id}/comments
    proposal-comments:
      capacity: ${RATE_LIMIT_PROPOSAL_COMMENTS_CAPACITY:30}
      period: ${RATE_LIMIT_PROPOSAL_COMMENTS_PERIOD:10m}

logging:
  level:
    root: INFO
    org.ceitba.api: DEBUG
