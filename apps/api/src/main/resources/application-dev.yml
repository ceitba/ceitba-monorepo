spring:
  jpa:
    properties:
      hibernate:
        format_sql: true
    show-sql: false

logging:
  level:
    org.ceitba.api: DEBUG
    org.hibernate.SQL: DEBUG

# Local dev runs the SPAs over plain http://localhost; a Secure cookie would
# be silently dropped. Vite proxies /api -> localhost:8080 so SameSite=Lax is
# enough on the same origin.
auth:
  cookie:
    secure: false
    same-site: Lax
