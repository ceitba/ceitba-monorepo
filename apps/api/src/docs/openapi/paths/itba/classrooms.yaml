# Classroom Controller Endpoints - RESTful Design
/itba/classrooms:
  get:
    tags:
      - ITBA Classrooms
    summary: Retrieve classroom data
    description: >
      Retrieves a list of classrooms with optional filtering by status.
      Results are grouped by building or by weekday and building depending on status.
    parameters:
      - in: query
        name: status
        required: false
        schema:
          type: string
          enum: [occupied, available]
        description: Filter by classroom status (occupied or available)
      - in: query
        name: current_semester
        required: false
        schema:
          type: boolean
        description: When status=occupied, filter for current semester only
    responses:
      200:
        description: Classroom data grouped by building or by day and building
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties:
                    type: array
                    items:
                      $ref: '#/components/schemas/Classroom'
                  description: Grouped by building (for all/available classrooms)
                - type: object
                  additionalProperties:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        $ref: '#/components/schemas/ClassroomSchedule'
                  description: Grouped by day and building (for occupied classrooms)
      500:
        description: Internal server error

/itba/classrooms/building/{building}:
  get:
    tags:
      - ITBA Classrooms
    summary: Get classrooms by building
    description: Retrieves all classrooms in a specific building
    parameters:
      - in: path
        name: building
        required: true
        schema:
          type: string
        description: Building name
    responses:
      200:
        description: List of classrooms in the building
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ClassroomSchedule'
      500:
        description: Internal server error

/itba/classrooms/day/{day}:
  get:
    tags:
      - ITBA Classrooms
    summary: Get classrooms by day
    description: Retrieves all occupied classrooms for a specific day
    parameters:
      - in: path
        name: day
        required: true
        schema:
          type: string
        description: Day of the week
    responses:
      200:
        description: List of classroom schedules for the day
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ClassroomSchedule'
      500:
        description: Internal server error

/itba/classrooms/conflicts:
  post:
    tags:
      - ITBA Classrooms
    summary: Check for classroom conflicts
    description: Checks if a classroom schedule conflicts with existing schedules
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClassroomConflictRequest'
    responses:
      200:
        description: List of conflicting schedules
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ClassroomSchedule'
      400:
        description: Invalid request data
      500:
        description: Internal server error