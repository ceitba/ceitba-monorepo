# Subject Plan Controller Endpoints - RESTful Design
/itba/plans/{planId}/subjects:
  get:
    tags:
      - ITBA Subject Plans
    summary: Get subjects by plan ID
    description: Retrieves all subjects for a specific plan with optional filtering
    parameters:
      - in: path
        name: planId
        required: true
        schema:
          type: string
        description: Plan ID
      - in: query
        name: year
        required: false
        schema:
          type: integer
        description: Filter by academic year
      - in: query
        name: semester
        required: false
        schema:
          type: integer
          enum: [1, 2]
        description: Filter by semester (1 or 2)
      - in: query
        name: section
        required: false
        schema:
          type: string
        description: Filter by section name
      - in: query
        name: type
        required: false
        schema:
          type: string
          enum: [elective]
        description: Filter by subject type (elective)
    responses:
      200:
        description: List of subjects in the plan
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/SubjectPlan'
      400:
        description: Invalid query parameters
      500:
        description: Internal server error
  post:
    tags:
      - ITBA Subject Plans
    summary: Create a subject plan
    description: Creates a new subject plan relationship for the specified plan
    parameters:
      - in: path
        name: planId
        required: true
        schema:
          type: string
        description: Plan ID
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateSubjectPlanRequest'
    responses:
      201:
        description: Subject plan created successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubjectPlan'
      400:
        description: Invalid request data
      500:
        description: Internal server error

/itba/plans/{planId}/subjects/api:
  get:
    tags:
      - ITBA Subject Plans
    summary: Get subjects by plan ID from ITBA API
    description: Retrieves all subjects for a specific plan from the external ITBA API
    parameters:
      - in: path
        name: planId
        required: true
        schema:
          type: string
        description: Plan ID
    responses:
      200:
        description: List of subjects in the plan from ITBA API
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/SubjectPlan'
      500:
        description: Internal server error

/itba/plans/{planId}/subjects/{subjectId}:
  get:
    tags:
      - ITBA Subject Plans
    summary: Get specific subject plan
    description: Retrieves a specific subject plan by plan ID and subject ID
    parameters:
      - in: path
        name: planId
        required: true
        schema:
          type: string
        description: Plan ID
      - in: path
        name: subjectId
        required: true
        schema:
          type: string
        description: Subject ID
    responses:
      200:
        description: Subject plan details
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubjectPlan'
      404:
        description: Subject plan not found
      500:
        description: Internal server error
  put:
    tags:
      - ITBA Subject Plans
    summary: Update a subject plan
    description: Updates an existing subject plan
    parameters:
      - in: path
        name: planId
        required: true
        schema:
          type: string
        description: Plan ID
      - in: path
        name: subjectId
        required: true
        schema:
          type: string
        description: Subject ID
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateSubjectPlanRequest'
    responses:
      200:
        description: Subject plan updated successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubjectPlan'
      404:
        description: Subject plan not found
      500:
        description: Internal server error
  delete:
    tags:
      - ITBA Subject Plans
    summary: Delete a subject plan
    description: Deletes an existing subject plan
    parameters:
      - in: path
        name: planId
        required: true
        schema:
          type: string
        description: Plan ID
      - in: path
        name: subjectId
        required: true
        schema:
          type: string
        description: Subject ID
    responses:
      204:
        description: Subject plan deleted successfully
      404:
        description: Subject plan not found
      500:
        description: Internal server error

/itba/subjects/{subjectId}/plans:
  get:
    tags:
      - ITBA Subject Plans
    summary: Get plans by subject ID
    description: Retrieves all plans that contain a specific subject
    parameters:
      - in: path
        name: subjectId
        required: true
        schema:
          type: string
        description: Subject ID
    responses:
      200:
        description: List of subject plans containing the subject
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/SubjectPlan'
      500:
        description: Internal server error

/itba/subjects/{subjectId}/dependencies:
  get:
    tags:
      - ITBA Subject Plans
    summary: Get subject dependencies
    description: Retrieves all dependencies for a specific subject in a plan
    parameters:
      - in: path
        name: subjectId
        required: true
        schema:
          type: string
        description: Subject ID
      - in: query
        name: planId
        required: true
        schema:
          type: string
        description: Plan ID
    responses:
      200:
        description: List of subject dependencies
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/SubjectPlan'
      400:
        description: Missing planId query parameter
      500:
        description: Internal server error