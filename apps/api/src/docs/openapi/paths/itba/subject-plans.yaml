# Subject Plan Controller Endpoints
/itba/subjects/plan/{planId}:
  get:
    tags:
      - ITBA Subject Plans
    summary: Get subjects by plan ID
    description: Retrieves all subjects for a specific plan from the database
    parameters:
      - in: path
        name: planId
        required: true
        schema:
          type: string
        description: Plan ID
    responses:
      200:
        description: List of subjects in the plan
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/SubjectPlan'
      500:
        description: Internal server error

/itba/subjects/plan/{planId}/api:
  get:
    tags:
      - ITBA Subject Plans
    summary: Get subjects by plan ID from ITBA API
    description: Retrieves all subjects for a specific plan from the external ITBA API
    parameters:
      - in: path
        name: planId
        required: true
        schema:
          type: string
        description: Plan ID
    responses:
      200:
        description: List of subjects in the plan from ITBA API
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/SubjectPlan'
      500:
        description: Internal server error

/itba/subjects/{subjectId}/plans:
  get:
    tags:
      - ITBA Subject Plans
    summary: Get plans by subject ID
    description: Retrieves all plans that contain a specific subject
    parameters:
      - in: path
        name: subjectId
        required: true
        schema:
          type: string
        description: Subject ID
    responses:
      200:
        description: List of subject plans containing the subject
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/SubjectPlan'
      500:
        description: Internal server error

/itba/subjects/plan/{planId}/section/{section}:
  get:
    tags:
      - ITBA Subject Plans
    summary: Get subjects by plan and section
    description: Retrieves all subjects in a specific plan section
    parameters:
      - in: path
        name: planId
        required: true
        schema:
          type: string
        description: Plan ID
      - in: path
        name: section
        required: true
        schema:
          type: string
        description: Section name
    responses:
      200:
        description: List of subjects in the plan section
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/SubjectPlan'
      500:
        description: Internal server error

/itba/subjects/plan/{planId}/electives:
  get:
    tags:
      - ITBA Subject Plans
    summary: Get elective subjects
    description: Retrieves all elective subjects for a specific plan
    parameters:
      - in: path
        name: planId
        required: true
        schema:
          type: string
        description: Plan ID
    responses:
      200:
        description: List of elective subjects
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/SubjectPlan'
      500:
        description: Internal server error

/itba/subjects/plan/{planId}/year/{year}:
  get:
    tags:
      - ITBA Subject Plans
    summary: Get subjects by year
    description: Retrieves all subjects for a specific plan and year
    parameters:
      - in: path
        name: planId
        required: true
        schema:
          type: string
        description: Plan ID
      - in: path
        name: year
        required: true
        schema:
          type: integer
        description: Academic year
    responses:
      200:
        description: List of subjects for the year
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/SubjectPlan'
      400:
        description: Invalid year parameter
      500:
        description: Internal server error

/itba/subjects/plan/{planId}/year/{year}/semester/{semester}:
  get:
    tags:
      - ITBA Subject Plans
    summary: Get subjects by semester
    description: Retrieves all subjects for a specific plan, year, and semester
    parameters:
      - in: path
        name: planId
        required: true
        schema:
          type: string
        description: Plan ID
      - in: path
        name: year
        required: true
        schema:
          type: integer
        description: Academic year
      - in: path
        name: semester
        required: true
        schema:
          type: integer
        description: Semester (1 or 2)
    responses:
      200:
        description: List of subjects for the semester
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/SubjectPlan'
      400:
        description: Invalid year or semester
      500:
        description: Internal server error

/itba/subjects/plan/{planId}/subject/{subjectId}/dependencies:
  get:
    tags:
      - ITBA Subject Plans
    summary: Get subject dependencies
    description: Retrieves all dependencies for a specific subject in a plan
    parameters:
      - in: path
        name: planId
        required: true
        schema:
          type: string
        description: Plan ID
      - in: path
        name: subjectId
        required: true
        schema:
          type: string
        description: Subject ID
    responses:
      200:
        description: List of subject dependencies
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
      500:
        description: Internal server error

/itba/subjects/plan:
  post:
    tags:
      - ITBA Subject Plans
    summary: Create a subject plan
    description: Creates a new subject plan relationship
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateSubjectPlanRequest'
    responses:
      201:
        description: Subject plan created successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubjectPlan'
      400:
        description: Invalid request data
      500:
        description: Internal server error
