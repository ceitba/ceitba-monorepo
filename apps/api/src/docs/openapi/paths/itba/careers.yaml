# Career Controller Endpoints
/itba/career/plans:
  get:
    tags:
      - ITBA Careers
    summary: Retrieve career plans
    description: >
      Retrieves a list of career plans grouped by career ID and name.
    responses:
      200:
        description: A map of career IDs to career details, including plans.
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/Career'
      500:
        description: Internal server error

/itba/career:
  get:
    tags:
      - ITBA Careers
    summary: Get all careers
    description: Retrieves a list of all careers
    responses:
      200:
        description: List of careers
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Career'
      500:
        description: Internal server error
  post:
    tags:
      - ITBA Careers
    summary: Create a new career
    description: Creates a new career
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateCareerRequest'
    responses:
      201:
        description: Career created successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Career'
      400:
        description: Invalid request data
      500:
        description: Internal server error

/itba/career/{id}:
  get:
    tags:
      - ITBA Careers
    summary: Get career by ID
    description: Retrieves a specific career by its ID
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: Career ID
    responses:
      200:
        description: Career details
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Career'
      404:
        description: Career not found
      500:
        description: Internal server error
  put:
    tags:
      - ITBA Careers
    summary: Update a career
    description: Updates an existing career
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: Career ID
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateCareerRequest'
    responses:
      200:
        description: Career updated successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Career'
      404:
        description: Career not found
      500:
        description: Internal server error
  delete:
    tags:
      - ITBA Careers
    summary: Delete a career
    description: Deletes an existing career
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: Career ID
    responses:
      204:
        description: Career deleted successfully
      404:
        description: Career not found
      500:
        description: Internal server error
