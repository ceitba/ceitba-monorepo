# Test-only overrides. JWT secret is required by JwtDecoder bean at startup.
# This is a fixed 33-byte key; do NOT use in production.
auth:
  jwt:
    secret: dGVzdC1qd3Qtc2VjcmV0LWtleS0zMmJ5dGVzLWxvbmch
    ttl-days: 1
  # This file shadows src/main/resources/application.yml entirely, so anything
  # the app dereferences unconditionally must be set here. Dummy OAuth client
  # so GET /v1/auth/google can build Google's authorization URL in ITs.
  google:
    client-id: test-client-id
    client-secret: test-client-secret
    redirect-uri: http://localhost:8080/api/v1/auth/callback

spring:
  # Mirror the main jpa block (this file shadows it): without ddl-auto the
  # default for a non-embedded DB is "none", so ITs never validated mappings.
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    # No hibernate.jdbc.time_zone, same as main (see the comment there and
    # LocalTemporalZoneIT).
    open-in-view: false
  flyway:
    # Never skip V1 in tests — fresh Testcontainers DBs need the full schema.
    baseline-on-migrate: false
    # Stop at V4.x: V5+ seed production-only data (ceitba@itba.edu.ar superadmin,
    # careers, organizations) that breaks count assertions and FK-restricted
    # deleteAll() in @BeforeEach. Pure-DDL changes that landed after V5 in prod
    # (V8/V9/V10/V12/V13/V14/V15/V16/V17/V18/V19/V20/V21/V22/V23/V24/V25/V26/V27/V28/V30/V31/V32/V33/V34/V35/V36) are mirrored in classpath:db/test-migration as
    # V4.2+, so the entity layer can validate against the full schema without
    # the seeds. Every new DDL migration in db/migration MUST get a mirror here
    # and this target bumped — see src/test/resources/db/test-migration/README.md.
    target: '4.28'
    locations: classpath:db/migration,classpath:db/test-migration

# Rate limiting is off by default in tests so ITs can hammer /v1/auth/**;
# RateLimitIT turns it back on explicitly.
rate-limit:
  enabled: false

# Use the default Springdoc path in tests to avoid suffix-matching ambiguity
# with the custom /docs.json path under server.servlet.context-path=/api.
# SecurityConfig already permits /v3/api-docs/**.
springdoc:
  api-docs:
    path: /v3/api-docs

# Wiki pipeline: fake inference (FakeLlmBatchClient / FakeSyncChatClient) and
# no background work; tests drive KbRunEngine.advanceActive() themselves.
kb:
  llm:
    use-fake: true
  pipeline:
    background: false
